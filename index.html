#pwaI{position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;display:none;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line2);border-radius:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.04em}#pwaI.show{display:flex}#pwaI button{background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;padding:8px 6px 8px 12px;letter-spacing:inherit}#pwaI button+button{padding:8px 10px 8px 4px;color:var(--dim)}

a{color:var(--line)}

<script>
/* PWA: registro do Service Worker (cache-first, uso offline) e botão discreto de instalação */
(function(){
 var box=document.getElementById('pwaI'),btn=document.getElementById('pwaB'),x=document.getElementById('pwaX'),ev=null;
 var standalone=function(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;};
 var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
 var off=function(){try{return localStorage.getItem('pwaX')==='1';}catch(e){return false;}};
 function show(){if(!standalone()&&!off())box.classList.add('show');}
 function hide(){box.classList.remove('show');}
 window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;show();});
 window.addEventListener('appinstalled',function(){ev=null;hide();});
 btn.addEventListener('click',function(){
  if(ev){ev.prompt();ev.userChoice.then(function(){ev=null;hide();}).catch(function(){});}
  else if(ios){alert('Para instalar: toque em Compartilhar e depois em "Adicionar à Tela de Início".');}
 });
 x.addEventListener('click',function(){hide();try{localStorage.setItem('pwaX','1');}catch(e){}});
 if(ios&&!standalone()&&/safari/i.test(navigator.userAgent))show();
 if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('Service Worker não registrado:',e);});});
 }
})();
</script>

 if(!near)navLock=false;}

/* ===== MÓDULO 4 — conteúdo: fichas, ambientes por convés, categorias, rota ===== */

const PD={
casco:['e','Casco','Hull','D',[40,14,14.2],170,'Aço doce rebitado — cerca de 3 milhões de rebites. 269,1 m de comprimento, 28,2 m de boca e 10,5 m de calado. Preto acima da linha d’água, vermelho anti-incrustante abaixo, com uma faixa amarela sob a superestrutura branca. O casco exibido é o do modelo 3D de Renan_1912 (reconstrução visual), não um levantamento dos planos do estaleiro.'],
proa:['e','Proa e castelo de proa','Bow / forecastle','D',[126,22.5,0],60,'Roda de proa quase vertical. No castelo ficam os molinetes, cabrestantes, cabeços de amarração, o quebra-mar em V e a âncora central de cerca de 15,5 t, com seu guindaste próprio. Abaixo: alojamentos de tripulação e paiol da amarra.'],
popa:['e','Popa e tombadilho','Stern / poop deck','D',[-122,22.5,0],60,'Popa elíptica em balanço sobre o leme e os hélices. O tombadilho era o espaço ao ar livre da 3ª classe; sobre ele ficava a ponte de atracação, usada nas manobras de porto. Abaixo do convés: sala geral e sala de fumar da 3ª classe.'],
quilha:['e','Quilha e cadaste','Keel / stern frame','D',[40,-.4,0],120,'A quilha foi batida em 31 de março de 1909 no estaleiro Harland & Wolff, em Belfast (casco nº 401). Sobre ela, um fundo duplo celular com cerca de 1,6 m de altura percorria quase todo o comprimento.'],
cavername:['e','Cavername','Frames','S',[100,8,-9],80,'Costelas de aço que dão forma ao casco e sustentam as chapas. No modelo há uma caverna a cada 6 m para facilitar a leitura; no navio real o espaçamento era de cerca de 90 cm a meio-navio e menor nas extremidades.'],
anteparas:['i','Anteparas estanques','Watertight bulkheads','D',[66,9,0],90,'Quinze anteparas transversais (A a P) dividiam o casco em 16 compartimentos. Subiam até o convés E a meio-navio e até o D nas extremidades — não até o topo do casco. As posições no modelo são aproximadas.'],
portas:['i','Portas estanques','Watertight doors','D',[47,2.9,0],50,'No nível do fundo, 12 portas verticais de ferro fundido desciam por gravidade. Podiam ser soltas por um interruptor elétrico na ponte, por alavanca no local ou automaticamente por um flutuador, se a água entrasse. Escadas de escape permitiam a saída de quem ficasse do outro lado.'],
conves:['e','Conveses','Decks','D',[60,19,6],100,'Dez níveis: Botes, A (passeio), B (ponte), C (abrigo), D (salão), E (superior), F (intermediário), G (inferior), Orlop e teto do fundo duplo. Use o modo “Conveses” para ver cada planta.'],
fundo:['i','Fundo duplo','Double bottom / tank top','D',[90,1.7,0],70,'Estrutura celular entre o fundo externo e o “teto do fundo duplo”, usada para lastro e água de alimentação das caldeiras. Protegia contra encalhes, mas não se estendia pelos costados — proteção acrescentada ao Olympic e ao Britannic depois de 1912.'],
superestrutura:['e','Superestrutura','Superstructure','D',[-30,25.5,14],120,'Conveses A e dos Botes. Traço que distingue o Titanic do Olympic de 1911: a metade de vante do passeio do convés A é fechada por janelas, e o convés B não tem passeio aberto — o espaço foi ocupado por camarotes, suítes com passeio privativo e o Café Parisien.'],
chamine:['e','Chaminés 1 a 3','Funnels 1–3','D',[11,46,0],110,'Elípticas, inclinadas para ré, na cor “buff” da White Star com topo preto. Cada uma recebe os condutos de fumaça de duas salas de caldeiras: nº 1 (salas 6 e 5), nº 2 (salas 4 e 3), nº 3 (salas 2 e 1).'],
chamine4:['e','Quarta chaminé','Fourth funnel','D',[-57,46,0],110,'Não servia às caldeiras. Ventilava a sala da turbina e das máquinas e recebia a exaustão das cozinhas e da lareira do salão de fumar. Também equilibrava visualmente o perfil do navio. Por isso não solta fumaça no modelo.'],
mastro:['e','Mastros','Masts','D',[-98,50,0],120,'Dois mastros de aço, inclinados como as chaminés. Sustentavam a antena Marconi, as luzes de navegação, os paus de carga e as bandeiras: a flâmula da White Star no mastro principal e o pavilhão azul (Blue Ensign) na popa.'],
gavea:['e','Gávea (cesto do vigia)','Crow’s nest','D',[87,39.6,0],46,'Plataforma no mastro de proa, cerca de 15 m acima do castelo. Dois vigias em turnos de duas horas. O acesso era por uma escada dentro do mastro oco. Tinha um sino e um telefone direto para a ponte. Abra “Gávea” no menu Explorar para ver daqui.'],
antena:['e','Antena Marconi','Marconi aerial','D',[0,58,0],140,'Quatro fios paralelos estendidos entre os dois mastros (antena em T), com descida até a sala de rádio no convés dos botes.'],
bote:['e','Botes salva-vidas','Lifeboats and davits','D',[48,28.6,12.6],60,'Vinte botes: 14 de madeira para 65 pessoas, 2 cúteres de emergência para 40 (mantidos prontos, fora da borda) e 4 desmontáveis Engelhardt para 47. Total: 1.178 lugares, para cerca de 2.200 pessoas a bordo — acima do exigido pela regra da época, baseada na tonelagem. Turcos Welin de duplo efeito, capazes de servir mais botes do que os instalados.'],
ancora:['e','Âncoras','Anchors','D',[129.2,21,2.7],46,'Duas âncoras de leva nos escovéns (cerca de 8 t cada) e uma âncora central de 15,5 t sobre o castelo, movimentada por um guindaste próprio.'],
corrente:['e','Amarras','Anchor chains','D',[118,23,2],46,'Correntes de elos com travessão, movidas pelos molinetes a vapor do castelo e guardadas no paiol da amarra.'],
conves_eq:['e','Guindastes e amarração','Cranes and mooring gear','R',[-83,24,8],70,'Guindastes elétricos nos poços de proa e de ré, cabrestantes e cabeços de amarração. Quantidade e posição no modelo são aproximadas.'],
apito:['e','Apito a vapor','Steam whistle','D',[62.5,44,0],60,'Apitos de bronze de três câmaras (três notas simultâneas), montados na face de vante das chaminés e alimentados com vapor das caldeiras. Só os das duas primeiras chaminés funcionavam; os demais eram decorativos. Eram acionados eletricamente da ponte pelo sistema Willett-Bruce: o oficial fechava uma chave de alavanca e uma válvula liberava o vapor. Havia duas chaves na antepara de vante da ponte e outras nas cabines das asas, e um temporizador elétrico podia tocá-los sozinho por 8 a 10 segundos a cada minuto em tempo fechado. No museu, segure a alavanca da esquerda para apitar; a da direita liga e desliga o temporizador. As chaves são uma reconstrução aproximada, baseada em fotos de chaves Willett-Bruce posteriores e em descrições do Olympic; forma e posição exatas não são conhecidas. O som é a gravação fornecida pelo autor do museu.'],
telefones:['e','Telefones da casa do leme','Wheelhouse telephones','D',[68.3,31.0,-1.2],7,'Na antepara de ré da casa do leme ficavam os telefones alto-falantes de padrão naval, cada um num circuito próprio: castelo de proa, gávea, casa das máquinas alternativas e ponte de atracação na popa. Na noite de 14 de abril, depois de dar três toques no sino, o vigia Frederick Fleet chamou a ponte; quem atendeu foi o sexto oficial James Moody. Quando o telefone da gávea tocar, toque nos aparelhos para atender. Os aparelhos são os do próprio modelo 3D.'],quadroWTD:['e','Quadro indicador das portas estanques','Watertight door indicator','D',[68.3,31.5,2.2],7,'Quadro do modelo 3D, redesenhado com base no filme Titanic (1997): uma lâmpada por porta estanque, que acende quando a porta está fechada. Use a chave preta logo abaixo. A existência e a forma exata de um quadro assim no Titanic não são documentadas.'],wtd:['e','Controle das portas estanques','Watertight door control','D',[68.25,30.96,2.11],5,'Aparelho do próprio modelo, abaixo do quadro indicador, na antepara de ré da casa do leme: disco de latão com a chave preta. Girando a chave, um eletroímã soltava a trava de cada porta estanque vertical das salas de caldeiras e de máquinas, que descia pelo próprio peso, freada por um amortecedor; no quadro acima, uma lâmpada acende para cada porta fechada. Toque na chave para fechar ou abrir. Logo após a colisão, o primeiro oficial Murdoch acionou o fechamento. As fontes de época situam a chave “no abrigo da ponte ou na sala de cartas”: a posição exata é debatida, e o quadro de lâmpadas segue a interpretação do filme de 1997, não um documento.'],portaGavea:['e','Porta da gávea','Crow’s nest door','D',[97.6,37.8,0],8,'O mastro de proa era oco: o vigia subia por uma escada interna e saía na gávea por esta porta estreita, curva como o próprio mastro e de cantos arredondados. No mastro caído do naufrágio ainda se vê a abertura e, acima dela, o gancho do sino. Toque para abrir ou fechar.'],interiorComando:['e','Salas de cartas e de navegação','Chart room and navigating room','D',[66.7,30.6,0],14,'Atrás da casa do leme ficavam a sala de cartas, a bombordo — mesa de cartas com gaveteiro, cronômetros, os dois relógios-mestre que comandavam os relógios do navio e os livros de sinais —, e a sala de navegação, a boreste, usada pelo comandante e pelos oficiais para os assuntos de navegação, com passagem para os aposentos do comandante. Mobiliário e acabamento são reconstruções aproximadas: não há fotografias destes interiores no Titanic.'],sino:['e','Sino da gávea','Crow’s nest bell','D',[97.57,39.35,0],14,'Sino de latão, com cerca de 38 cm de boca, pendurado num suporte em pescoço de ganso na face de vante do mastro de proa, logo acima da porta por onde os vigias entravam na gávea — no mastro caído do naufrágio ainda se vê o gancho sobre essa porta. Tocava-se puxando o cabo preso ao badalo: um toque para objeto a bombordo, dois a boreste, três bem à frente. Às 23h40 de 14 de abril de 1912, Frederick Fleet deu três toques e telefonou à ponte. O sino foi recuperado do campo de destroços em 1987. Os detalhes do suporte e do badalo são uma reconstrução aproximada.'],
leme:['e','Leme','Rudder','D',[-128,5,0],50,'Um único leme central de aço fundido, com cerca de 24 m de altura e mais de 100 t, movido por máquinas a vapor na popa comandadas pelo telemotor da ponte.'],
helice:['e','Hélices','Propellers','D',[-119,3.5,6.4],50,'Três hélices de bronze. Os laterais (7,2 m, três pás) eram movidos pelas máquinas alternativas; o central (cerca de 5,2 m), pela turbina. Nota: o número de pás do hélice central do Titanic é debatido — um caderno do estaleiro indica três pás, e não quatro como no Olympic de 1911. O modelo segue três.'],
ponte:['e','Ponte de comando','Navigating bridge','D',[66.5,28.6,0],60,'Posto de comando no extremo de vante do convés dos botes, com asas até a borda. Na frente fica a ponte de navegação, com nove janelas, o timão auxiliar, a bitácula e cinco telégrafos; atrás dela, a casa do leme, fechada, com o timão principal, o telemotor e os telefones. Dos dois lados da casa do leme ficam as portas da casa dos oficiais: a boreste, sala de navegação e aposentos do comandante; a bombordo, sala de cartas e corredor dos oficiais. Use “Visitar” para entrar e caminhar entre os ambientes.'],
camarotes:['i','Divisórias de camarotes','Cabin partitions','S',[20,17,9],70,'Divisórias genéricas, apenas para dar leitura aos cortes. A arrumação real de cada convés está nas plantas do modo “Conveses”.'],
caldeira:['m','Caldeiras','Scotch boilers','D',[3.3,7.4,0],80,'29 caldeiras escocesas de 4,8 m de diâmetro: 24 de dupla face (6,1 m, seis fornalhas) e 5 de face simples (três fornalhas), a 215 psi (14,8 bar). Seis salas: a nº 6, a vante, com quatro; as nº 5 a 2 com cinco lado a lado; a nº 1 com as cinco de face simples. Total: 159 fornalhas.'],
fornalha:['m','Fornalhas','Furnaces','D',[6.4,3.3,0],34,'159 fornalhas corrugadas. Os foguistas lançavam o carvão em camada fina, quebravam a escória e retiravam as cinzas, que iam para ejetores e eram lançadas ao mar. O consumo passava de 600 toneladas por dia.'],
carvao:['m','Carvoeiras','Coal bunkers','D',[12,8.6,0],70,'Depósitos transversais junto a cada antepara das salas de caldeiras, com portas diante das fornalhas. Capacidade: cerca de 6.600 t. Carvoeiros (trimmers) levavam o carvão em carrinhos até a praça de fornalhas.'],
dutos:['m','Condutos de fumaça','Uptakes','D',[30,16,0],80,'Levam os gases das caldeiras até as três primeiras chaminés, atravessando os conveses de passageiros dentro de invólucros.'],
salaCald:['m','Salas de caldeiras','Boiler rooms','D',[20.8,2.4,6],70,'Seis salas numeradas de ré para vante (1 a 6). Cerca de 175 foguistas e 70 carvoeiros trabalhavam em turnos de 4 horas. A ventilação era forçada por ventiladores elétricos.'],
maquina:['m','Máquinas alternativas','Triple-expansion engines','D',[-43.5,12.6,6.4],60,'Duas máquinas de quatro cilindros e tripla expansão: um de alta pressão (54 pol. · 1,37 m), um de média (84 pol. · 2,13 m) e dois de baixa (97 pol. · 2,46 m), curso de 75 pol. (1,91 m) Cerca de 15.000 cv (≈ 11 MW) cada, a 75 rpm, movendo os hélices laterais. Tinham quase 10 m de altura. Podiam inverter a rotação para dar ré.'],
bielas:['m','Bielas e manivelas','Connecting rods and cranks','S',[-41.5,6,6.4],34,'Haste, cruzeta e biela transformam o vaivém do êmbolo em rotação. No modelo as manivelas estão a 90°; o navio real usava o balanceamento Yarrow-Schlick-Tweedy, com ângulos diferentes. O mecanismo das válvulas não é mostrado.'],
turbina:['m','Turbina de baixa pressão','Parsons low-pressure turbine','D',[-62.5,7,0],50,'Turbina Parsons de exaustão: aproveitava o vapor que saía das máquinas alternativas, já a cerca de 9 psi (0,6 bar) absolutos, e o expandia até quase o vácuo. Cerca de 16.000 cv (≈ 11,8 MW) a 165 rpm no hélice central. Não invertia: nas manobras e em marcha a ré o vapor era desviado direto aos condensadores e o hélice central ficava parado.'],
rotor:['m','Rotor da turbina','Turbine rotor','D',[-62.5,4,2.8],34,'Tambor de aço com cerca de 3,7 m de diâmetro e fileiras de palhetas. O vapor passa entre palhetas fixas e móveis e faz o rotor girar continuamente — sem êmbolos nem bielas, ao contrário das máquinas alternativas.'],
condensador:['m','Condensadores','Condensers','D',[-62.5,6.6,9.6],46,'Dois condensadores de superfície ao lado da turbina. Água do mar fria circula por milhares de tubos; o vapor condensa, cria vácuo e volta como água doce para as caldeiras.'],
valvulas:['m','Válvulas de mudança','Changeover valves','D',[-54.6,12.9,6.4],40,'Dirigem a exaustão das máquinas alternativas para a turbina (marcha avante, acima de meia força) ou direto para os condensadores (manobras e ré).'],
salaMaq:['m','Casa de máquinas','Engine rooms','D',[-43.5,8,0],70,'Três compartimentos seguidos: máquinas alternativas, turbina e dínamos. Na plataforma de manobra ficavam os repetidores do telégrafo, as válvulas e os manômetros.'],
telegrafoM:['m','Telégrafo da casa de máquinas','Engine-room telegraph','D',[-36,3.6,0],30,'Recebe a ordem da ponte na plataforma de manobra das máquinas alternativas: o ponteiro vermelho se move e uma campainha toca. O maquinista responde levando a própria alavanca à mesma posição — só então a ponte sabe que a ordem foi entendida — e manobra as válvulas à mão. O modelo reaproveita o telégrafo da ponte, com ponteiro de ordem e gongo; a forma exata dos aparelhos da casa de máquinas do Titanic não está documentada em fotografia.'],
dinamo:['m','Dínamos','Electric generators','D',[-79.5,5,0],46,'Quatro grupos de 400 kW (100 V em corrente contínua, 16.000 A no total), cada um movido por sua própria máquina a vapor, num compartimento estanque a ré da turbina. Dois geradores de emergência de 30 kW ficavam acima da linha d’água, no convés D. Alimentavam cerca de 10.000 lâmpadas, elevadores, ventiladores, guindastes e o rádio.'],
eixo:['m','Linhas de eixo','Propeller shafts','D',[-90,4,6.4],70,'Três eixos de aço forjado correm por túneis até a popa. Um mancal de escora em cada linha transmite o empuxo do hélice ao casco.'],
tubos:['m','Tubulação de vapor','Steam piping','S',[-10,9.6,3.2],80,'Percurso do vapor no modelo: branco = vapor vivo das caldeiras; azul-claro = entre os cilindros; azul = exaustão para a turbina e os condensadores; cinza = gases para as chaminés. Traçado esquemático.'],
cupula:['s','Cúpula de vidro','Glass dome','D',[-1,6.6,0],0,'Cúpula de ferro forjado e vidro que iluminava a escadaria com luz natural durante o dia. À noite era iluminada por trás.'],
relogio:['s','Relógio “Honra e Glória coroando o Tempo”','Clock panel','D',[-5.4,2.4,0],0,'Painel entalhado em carvalho no patamar, com duas figuras alegóricas ladeando o relógio. O entalhe aqui é apenas sugerido (reconstrução).'],
querubim:['s','Querubim com tocha','Cherub lamp','D',[1.25,1.6,0],0,'Estatueta de bronze segurando uma luminária, ao pé do corrimão central no convés A.'],
balaustrada:['s','Balaustrada','Balustrade','D',[0,2,2.6],0,'Corrimãos de carvalho sobre grades de ferro forjado com detalhes dourados, no estilo inglês do fim do século XVII. Os balaústres aqui são torneados simples (reconstrução).'],
elevador:['s','Elevadores','Lifts','D',[7.9,1.2,0],0,'Três elevadores elétricos da 1ª classe, logo a vante da escadaria, serviam do convés A ao E. A 2ª classe tinha um; a 3ª, nenhum.'],
timao:['s','Timão','Ship’s wheel','D',[2.9,1.1,0],0,'A roda não puxava o leme. Girá-la movia o telemotor, um transmissor hidráulico: a pressão seguia por tubos finos até a popa e comandava a válvula das máquinas a vapor do leme, que giravam o quadrante. Eram duas rodas: a principal ficava na casa do leme, fechada, logo atrás da ponte, montada sobre o telemotor e usada em mar aberto; a da ponte de navegação era auxiliar, para entradas e saídas de porto, ligada à primeira por um eixo sob o teto. No museu as duas giram juntas.'],
bussola:['s','Bússola e bitácula','Compass binnacle','D',[3.6,1.3,0],0,'Bússola magnética em suspensão cardã, com esferas de ferro doce para compensar o magnetismo do casco. O timoneiro mantinha o rumo ordenado; a bússola padrão, numa plataforma entre a 2ª e a 3ª chaminé, servia para conferir.'],
telegrafoP:['s','Telégrafo de ordens','Engine order telegraph','D',[3.7,1.4,4.6],0,'Transmite ordens — não aciona nada. Mover a alavanca faz um ponteiro repetir a ordem na casa de máquinas e tocar uma campainha. Abra “Telégrafo” para operar.'],
telemotor:['s','Telemotor','Telemotor','D',[.95,1,0],0,'Coluna hidráulica sob a roda do leme, que transmite o movimento até a máquina do leme na popa.'],
telefone:['s','Telefones','Telephones','D',[-1.1,1.5,0],0,'Linhas diretas da casa do leme para a gávea, o castelo de proa, a ponte de atracação da popa e a casa de máquinas.'],
cartas:['s','Mesa de cartas','Chart table','D',[-3.6,1,0],0,'Cartas do Atlântico Norte, compasso, réguas paralelas e cronômetros. A posição era calculada pelos astros (sextante e cronômetro) e por estima: rumo, velocidade e tempo.'],
relogioN:['s','Relógio de bordo','Ship’s clock','D',[-5.8,1.9,0],0,'A hora de bordo era ajustada todos os dias conforme a longitude; relógios-mestres comandavam os demais.'],
chaveMorse:['s','Chave telegráfica','Morse key','D',[-.5,.9,-.95],0,'Manipulador com que o operador abre e fecha o circuito do transmissor, formando pontos e traços.'],
receptor:['s','Receptor','Receiver','D',[.55,1.1,-1.3],0,'Detector magnético Marconi e sintonizador múltiplo. O sinal era ouvido como cliques e zumbidos nos fones — não havia alto-falante nem voz.'],
fones:['s','Fones de ouvido','Headphones','D',[-1.05,.95,-1.0],0,'O operador passava horas com os fones, anotando letra por letra em formulários.'],
transmissor:['s','Transmissor de centelha','Rotary spark transmitter','D',[3.6,1.1,-1.0],0,'Aparelho de 5 kW com centelhador rotativo, instalado numa “sala silenciosa” ao lado, forrada para abafar o ruído. Alcance garantido de cerca de 400 km de dia, muito maior à noite.'],
cab1:['s','Camarote de 1ª classe','First-class stateroom','R',[0,1.2,0],0,'Cama de latão, sofá, guarda-roupa, lavatório de mármore com água corrente, aquecedor elétrico e painéis decorados em estilos de época. As suítes de luxo do convés B tinham ainda sala de estar, banheiro e passeio privativos.'],
cab2:['s','Cabine de 2ª classe','Second-class cabin','R',[0,1.2,7],0,'Dois a quatro leitos em beliches de mogno, sofá-cama, lavatório dobrável e paredes esmaltadas de branco. Equivalia à primeira classe de muitos navios menores.'],
cab3:['s','Cabine de 3ª classe','Third-class cabin','R',[0,1.2,12.5],0,'Dois a dez leitos em beliches de ferro, com colchão, cobertor e lavatório — simples, mas com camarotes fechados, quando muitos navios ainda usavam dormitórios abertos. Homens sozinhos ficavam na proa; mulheres e famílias, na popa.'],

 else if(t==='sink'){h='<div class="skTop"><div class="skrow"><div><div id="skc">23h38</div><div class="note" style="margin:0" id="skd">14 de abril</div></div><button class="btn on" id="skp">'+ic('play')+' Reproduzir</button><button class="btn" id="sk0" title="Voltar ao início">'+ic('start')+'</button><div class="musw" id="musW"><div class="musp"><div id="musS" tabindex="0" role="slider" aria-label="Volume da música"><b></b><u></u></div><button id="musPP" title="Pausar a música">'+ic('pause')+'</button><button id="musMt" title="Silenciar a música">'+ic('violinOff')+'</button></div><button id="skM" aria-label="Música do naufrágio">'+ic('violin')+'</button></div></div><div class="skch"><button class="btn" data-ch="0">Colisão</button><button class="btn" data-ch="1">Naufrágio</button><button class="btn" data-ch="2">Descida</button><button class="btn" data-ch="3">Destroços</button></div><input id="skr" type="range" min="-2" max="176" step="0.5" value="-2"><div class="kv"><div><span id="skA">0°</span><small>inclinação</small></div><div><span id="skB">intacto</span><small>casco</small></div><div><span id="skL">acesas</span><small>luzes</small></div><div><span id="skN">0 / 20</span><small>botes na água</small></div></div></div><div id="skev">'+SK.map((e,i)=>'<div class="ev" data-sk="'+e[0]+'"><b>'+e[1]+'</b><p style="display:block">'+esc(e[2])+'</p></div>').join('')+'<p class="note"><b>Reconstituição:</b> os horários são os de bordo e seguem os inquéritos de 1912 e estudos posteriores; alguns são aproximados e discutidos. Os últimos cinco minutos passam em câmera lenta. Ângulos, a ordem exata da queda das chaminés e o movimento das duas metades são aproximações: a ruptura é mostrada como um corte limpo entre a 3ª e a 4ª chaminés. Os botes deixam os turcos no horário aproximado de cada um; os 16 botes dos turcos somem do convés nesse momento e suas posições na água são ilustrativas; os quatro desmontáveis não têm peça própria no modelo. Na colisão, o tamanho e a forma do iceberg são supostos. Na descida, a altura da coluna d’água está comprimida (400 m no modelo para 3.800 m reais); no fundo, a distância entre proa e popa está em escala, e a popa aparece apenas achatada, sem o detalhe real dos danos. Das cerca de 2.200 pessoas a bordo, perto de 710 sobreviveram.</p><p class="note"><b>A música do violino — “Nearer, My God, to Thee”.</b> Os oito músicos do Titanic, liderados pelo violinista Wallace Hartley, tocaram no convés para acalmar os passageiros enquanto os botes eram arriados, e nenhum deles sobreviveu. Vários sobreviventes contaram que o último hino foi este, um hino religioso do século XIX sobre buscar consolo em Deus na hora da provação; Hartley teria dito antes que o tocaria se estivesse num naufrágio. Outros relatos, como o do operador Harold Bride, apontam a valsa “Songe d’Automne”, e não se sabe qual versão da melodia teria sido tocada. A escolha aqui segue a tradição mais conhecida, não um fato comprovado. A gravação foi fornecida pelo autor do museu; a música toca separada do som ambiente. Toque no violino para abrir o volume (a música começa ao abrir); o botão no fim da barra silencia e restaura.</p><p class="note"><b>Descida:</b> a proa, afilada, teria descido num ângulo raso e planado à frente, chegando a uns 600 m da popa; a popa, cheia de ar e rompida, teria girado e caído quase na vertical. Isso é o que os destroços e as reconstruções indicam — não há registro do trajeto real, e a animação é uma representação plausível. Os tempos da descida (cerca de 5 a 10 minutos) estão comprimidos.</p></div>';}
 else if(t==='sobre'){h='<h4>Como ler as fichas</h4><div class="tags"><span class="tg D">Documentado</span><span class="tg R">Reconstrução visual</span><span class="tg S">Simplificação</span></div><p class="note" style="color:var(--ink)">Dimensões, máquinas, caldeiras, botes e organização dos conveses seguem os registros do Titanic em abril de 1912. Toda a geometria 3D é reconstrução feita por código: o casco é gerado por fórmulas e os interiores foram montados a partir de descrições e fotografias de época, muitas do gêmeo Olympic.</p>'+
  '<h4>Implementado nesta versão</h4><p class="note">Exterior completo · 10 conveses com planta e 45 ambientes localizados · 19 cenários internos em 3D com caminhada: Grande Escadaria com elevadores em movimento, ponte, aposentos do comandante, sala Marconi, lounge, sala de leitura, salão de fumar, restaurante, Café Parisien, corredor, ginásio, piscina, banhos turcos, squash, biblioteca, salas da 3ª classe, cabines e salões de jantar · passagem a pé entre ambientes pelas portas e pelo elevador · gávea · caldeiras, máquinas, turbina, dínamos e hélices animados · telégrafo · Morse · alagamento · reconstituição do naufrágio · rota · dia/noite · blueprint, corte e vista explodida · busca.</p>'+
  '<h4>Limites desta versão</h4><p class="note"><b>Passagens:</b> cada porta leva diretamente ao ambiente vizinho; os corredores intermediários não são percorridos, com exceção de um trecho do corredor do convés B. As ligações são plausíveis, não a planta exata.<br><b>Imagens históricas:</b> sete imagens em domínio público do Wikimedia Commons aparecem nas fichas correspondentes, com legenda, autoria e fonte; a ficha diz quando se trata de desenho ou do navio gêmeo. O museu procura primeiro o arquivo na pasta assets/images/historical e, se não o achar, busca a imagem no Commons; onde imagens externas são bloqueadas, fica o atalho para a fonte.<br><b>Modelo do navio:</b> há um único Titanic na cena — o modelo “RMS Titanic 1912”, de Renan_1912 (<a href=\"https://sketchfab.com/3d-models/rms-titanic-1912-fe1019b8f4bf46eea28cdb7a866f05e0\" target=\"_blank\" rel=\"noopener\">Sketchfab</a>, licença <a href=\"http://creativecommons.org/licenses/by/4.0/\" target=\"_blank\" rel=\"noopener\">CC BY 4.0</a>). É exibido com a geometria completa (sem simplificação), as texturas originais e as faces com a orientação definida pelo autor; o arquivo foi apenas comprimido e dividido pelo museu em partes articuladas: duas metades do casco, superestrutura, quatro chaminés, dois mastros, cordame, 16 botes, três hélices e leme; o casco foi escurecido, as janelas ganharam luz noturna e 18 molduras triangulares soltas nas laterais do convés A, sem correspondência identificada no navio real, foram retiradas. Conveses internos, anteparas, caldeiras e máquinas são gerados por código e ajustados à forma desse casco. Se o modelo não puder ser carregado, o museu usa um casco gerado por código no lugar (nunca os dois).<br><b>Sons:</b> o mar, a água no casco, as máquinas (com batida ligada às rotações), os ruídos do naufrágio e a colisão são sintetizados no navegador. O apito e o sino usam as gravações do autor do museu quando presentes em assets/audio/ship; na falta delas, sons sintetizados. Abaixo da superfície, o som ambiente e os efeitos ficam abafados (filtro passa-baixas). O botão das ondas abre o volume do som ambiente (mar, água no casco, máquinas), que começa em 10% e tem um botão de mudo próprio; apito, sinos, telégrafo e Morse não dependem dele.<br><b>Ponte:</b> o timão gira com o leme e as alavancas dos cinco telégrafos acompanham a ordem dada; todas se movem juntas, o que é uma simplificação.<br><b>Oceano:</b> ondulação, ondas de proa e de esteira (padrão de Kelvin, com comprimento de onda ligado à velocidade) e espuma são calculados por shader; é uma aproximação visual, não uma simulação de fluidos.<br><b>Naufrágio:</b> ruptura, queda das chaminés, posição dos botes, ondas e espuma da ruptura e a descida das duas metades são representações esquemáticas, não reconstituições exatas. No fundo, as luzes âmbar são de observação (como as dos submersíveis que visitam os destroços), um recurso visual.<br><b>Ingressos:</b> o gerador de ingressos é uma ferramenta à parte, aberta num painel sobre o museu; o ingresso desenhado segue o modelo original do gerador.<br><b>Ainda sem cenário:</b> escadaria de ré, Verandah Café, sala de fumar da 2ª classe.</p>'+
  '<h4>Fontes para consulta</h4><p class="note"><a href="https://www.encyclopedia-titanica.org/" target="_blank" rel="noopener">Encyclopedia Titanica</a> · <a href="https://www.titanicinquiry.org/" target="_blank" rel="noopener">Titanic Inquiry Project</a> (inquéritos de 1912) · <a href="https://www.norwayheritage.com/p_ship.asp?sh=titan" target="_blank" rel="noopener">Norway Heritage</a> (descrição técnica de época) · <a href="https://en.wikipedia.org/wiki/Titanic" target="_blank" rel="noopener">Wikipedia — Titanic</a> · revista The Shipbuilder, número especial de 1911.</p>'+
  '<h4>Autoria</h4><p class="note" style="color:var(--ink)"><b style="color:var(--brass);font-size:14px">Desenvolvido por Davi Caetano</b><br>Projeto independente de museu virtual e simulação tridimensional do RMS Titanic, dedicado à exploração interativa, à história naval e à visualização de estruturas e acontecimentos relacionados à embarcação.</p><p class="note"><a class="lnk" href="https://www.linkedin.com/in/davicaetanosilva/" target="_blank" rel="noopener"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3.5"/><path d="M8 10.5V17M8 7.4v.1M11.5 17v-6.5M11.5 13.2c0-1.6 1-2.7 2.4-2.7s2.1 1 2.1 2.6V17"/></svg>Contato profissional: LinkedIn</a></p>'+

(function(){if(!GL)return;const mg=items.find(i=>i.id==='mastro');if(!mg)return;const fm=mg.o.children[0]||mg.o;root.updateMatrixWorld(true);

function cmdTrill(n,f1,f2,rate,vol){const a=AC;if(!a)return null;try{const t=a.currentTime,o1=a.createOscillator(),o2=a.createOscillator(),lfo=a.createOscillator(),lg=a.createGain(),vca=a.createGain(),g=a.createGain(),bp=a.createBiquadFilter();
 o1.type='triangle';o1.frequency.value=f1;o2.type='square';o2.frequency.value=f2;lfo.type='square';lfo.frequency.value=rate;lg.gain.value=.5;vca.gain.value=.5;lfo.connect(lg);lg.connect(vca.gain);bp.type='bandpass';bp.frequency.value=2200;bp.Q.value=.8;
 o1.connect(vca);o2.connect(vca);vca.connect(bp);bp.connect(g);g.connect(out());g.gain.setValueAtTime(0,t);for(let k=0;k<n;k++){g.gain.setValueAtTime(vol,t+k*1.7);g.gain.setValueAtTime(vol,t+k*1.7+1.05);g.gain.linearRampToValueAtTime(0,t+k*1.7+1.1);}
 const end=t+n*1.7+.2;[o1,o2,lfo].forEach(o=>{o.start(t);o.stop(end);});return{g:g,stop(){try{const u=a.currentTime;g.gain.cancelScheduledValues(u);g.gain.setValueAtTime(g.gain.value,u);g.gain.linearRampToValueAtTime(0,u+.06);[o1,o2,lfo].forEach(o=>o.stop(u+.1));}catch(e){}}};}catch(e){return null;}}
