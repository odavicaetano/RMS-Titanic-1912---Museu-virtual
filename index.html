<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RMS Titanic 1912 — Museu virtual 3D e blueprint</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1120;--ink:#e6eef8;--dim:#93a7bf;--line:#7fd1ff;--line2:rgba(127,209,255,.22);--panel:rgba(9,19,34,.82);--warn:#ffb347;--bad:#ff6b5e;--ok:#6fe0a5;--brass:#d9b36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:14px}
#app{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 35%,#1a2c44 0%,#0c1626 55%,#060b14 100%);transition:background .5s}
#app.bp{background:
 repeating-linear-gradient(0deg,rgba(140,200,255,.07) 0 1px,transparent 1px 32px),
 repeating-linear-gradient(90deg,rgba(140,200,255,.07) 0 1px,transparent 1px 32px),
 radial-gradient(120% 90% at 50% 35%,#0f3a72 0%,#0a2a56 55%,#061a38 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;display:flex;align-items:center;gap:5px;border:0;background:none;padding:4px;color:var(--ink);font:500 11px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.lbl i{font:500 10px/18px "IBM Plex Mono",monospace;font-style:normal;width:19px;height:19px;border-radius:50%;border:1px solid var(--line);background:rgba(6,16,30,.78);color:var(--line);text-align:center;flex:none}
.lbl span{display:none;background:rgba(6,16,30,.7);padding:3px 6px;border-left:1px solid var(--line)}
.lbl.on i{background:var(--line);color:#04101e}
.lbl.on span{display:block}
.dim{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:500 10px/1 "IBM Plex Mono",monospace;color:#cfeaff;background:rgba(8,38,80,.8);padding:3px 6px;border:1px solid var(--line2);white-space:nowrap}
#top{background:linear-gradient(rgba(5,10,19,.8),rgba(5,10,19,0));padding-bottom:26px!important;position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px;pointer-events:none}
.brand .tag{font:500 9px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;color:var(--line)}
.brand h1{margin:3px 0 1px;font:700 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.03em;text-transform:uppercase}
.brand h1 em{font-style:normal;font-weight:500;color:var(--brass)}
.brand p{margin:0;font-size:11px;color:var(--dim)}
#hud{display:flex;flex-direction:column;gap:3px;align-items:flex-end;font:500 11px/1 "IBM Plex Mono",monospace;pointer-events:auto}
#hud div{background:var(--panel);border:1px solid var(--line2);padding:4px 7px;min-width:78px;text-align:right}
#hud b{color:var(--line);font-weight:500}
#side{position:absolute;right:10px;top:104px;display:flex;flex-direction:column;gap:7px}
.rb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font:600 12px "Barlow Condensed",sans-serif;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rb.on{background:var(--line);color:#04101e;border-color:var(--line)}
#cutbar{position:absolute;left:10px;right:60px;top:104px;display:none;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line2);padding:6px 9px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:460px}
#cutbar.show{display:flex}
#cutbar button{flex:none}
.chip,.btn{border:1px solid var(--line2);background:rgba(127,209,255,.06);color:var(--ink);font:600 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;cursor:pointer;white-space:nowrap}
.chip.on,.btn.on{background:var(--line);color:#04101e;border-color:var(--line)}
.btn.hot{border-color:var(--warn);color:var(--warn)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line2)}
input[type=range]::-moz-range-track{height:3px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--line);margin-top:-8px;border:2px solid #04101e}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--line);border:2px solid #04101e}
#bottom{position:absolute;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0)}
#tools{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools .chip{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#tools .chip.on{background:var(--line)}
#modes{display:flex;background:rgba(5,12,22,.94);border-top:1px solid var(--line2)}
#modes button{flex:1;border:0;border-right:1px solid rgba(127,209,255,.1);background:none;color:var(--dim);font:600 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.07em;text-transform:uppercase;padding:9px 2px 10px;cursor:pointer}
#modes button small{display:block;font:400 9px/1 "IBM Plex Mono",monospace;margin-bottom:5px;color:rgba(127,209,255,.55);letter-spacing:.1em}
#modes button.on{color:#04101e;background:var(--line)}
#modes button.on small{color:#0b3a66}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:46%;display:none;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:up .25s ease}
#sheet.show{display:flex}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#sheetHead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line2);flex:none}
#sheetHead h2{margin:0;font:600 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--line)}
#sheetHead button{border:0;background:none;color:var(--ink);font-size:20px;line-height:1;padding:2px 6px;cursor:pointer}
#sheetBody{overflow-y:auto;padding:10px 12px 14px;-webkit-overflow-scrolling:touch}
.ficha h3{margin:0;font:700 22px/1.05 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em}
.ficha .hd{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.ficha .num{font:500 12px/26px "IBM Plex Mono",monospace;width:28px;height:28px;text-align:center;border:1px solid var(--line);border-radius:50%;color:var(--line);flex:none}
.ficha .en{font:400 11px "IBM Plex Mono",monospace;color:var(--brass)}
dl{margin:8px 0 0;display:grid;grid-template-columns:92px 1fr;gap:0}
dt{font:600 10px/1.5 "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--line);padding:6px 6px 6px 0;border-top:1px solid var(--line2)}
dd{margin:0;padding:6px 0;border-top:1px solid var(--line2);line-height:1.4;font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.note{font-size:11.5px;color:var(--dim);line-height:1.4;margin:8px 0 0}
.note b{color:var(--warn);font-weight:500}
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g{position:relative;text-align:center;border:1px solid var(--line2);padding:4px 2px 5px;background:rgba(127,209,255,.04)}
.g svg{width:100%;max-width:74px;display:block;margin:0 auto}
.g .v{position:absolute;left:0;right:0;top:27%;font:500 13px "IBM Plex Mono",monospace}
.g .u{font:400 9px "IBM Plex Mono",monospace;color:var(--dim)}
.g .t{font:600 9.5px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--line);margin-top:1px}
.g.warn .v{color:var(--warn)}.g.bad .v{color:var(--bad)}
.ctl{margin-top:10px}
.ctl label{display:flex;justify-content:space-between;font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--line)}
.ctl label b{color:var(--ink);font:500 11px "IBM Plex Mono",monospace}
#status{margin-top:8px;font:400 11px/1.4 "IBM Plex Mono",monospace;color:var(--ok);min-height:16px}
#status.warn{color:var(--warn)}#status.bad{color:var(--bad)}
.list{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.list button{display:flex;align-items:center;gap:6px;text-align:left;border:1px solid var(--line2);background:rgba(127,209,255,.04);color:var(--ink);padding:6px;font:500 12.5px "Barlow",sans-serif;cursor:pointer;min-width:0}
.list button i{font:400 10px "IBM Plex Mono",monospace;font-style:normal;color:var(--line);flex:none}
.list button.off{opacity:.45}
h4{margin:12px 0 6px;font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
h4:first-child{margin-top:0}
.step{display:flex;gap:10px;align-items:flex-start}
.step .n{font:700 34px/1 "Barlow Condensed",sans-serif;color:var(--line);min-width:38px}
.step h3{margin:0 0 4px;font:700 18px/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase}
.step p{margin:0;line-height:1.45;font-size:13px}
.dots{display:flex;gap:4px;margin-top:10px}
.dots b{flex:1;height:3px;background:var(--line2)}.dots b.on{background:var(--line)}
.sys{border:1px solid var(--line2);margin-bottom:6px;background:rgba(127,209,255,.04)}
.sys summary{padding:8px;font:600 13px "Barlow Condensed",sans-serif;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
.sys div{padding:0 8px 8px;font-size:13px;line-height:1.45}
.tog{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line2);font-size:13px}
.tog:first-of-type{border-top:0}
a{color:var(--line)}
#hint{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:400 11px "IBM Plex Mono",monospace;color:var(--dim);background:var(--panel);padding:7px 10px;border:1px solid var(--line2);pointer-events:none;transition:opacity .8s;text-align:center;white-space:nowrap}
#load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#081425;font:500 12px "IBM Plex Mono",monospace;color:var(--line);letter-spacing:.1em;text-align:center;padding:20px;z-index:9}
@media (min-width:900px){
 #sheet{left:auto;right:14px;top:86px;bottom:112px;width:390px;max-height:none;border:1px solid var(--line2)}
 #side{right:auto;left:14px;top:110px}
 #cutbar{left:66px;top:110px}
 .brand h1{font-size:30px}
 #top{padding:14px 18px}
 #hud{flex-direction:row}
 #tools{justify-content:center}
 #modes{max-width:720px;margin:0 auto;border:1px solid var(--line2);border-bottom:0}
 .lbl span{display:block}
}
@media (max-height:480px){#sheet{max-height:62%;left:auto;width:54%}.brand p{display:none}#side{top:64px}#cutbar{top:64px}}

#app.night{background:radial-gradient(120% 90% at 50% 35%,#0b1524 0%,#050a12 60%,#020409 100%)}
#app.deep{background:radial-gradient(120% 90% at 50% 20%,#0a2233 0%,#04101a 55%,#010508 100%)}
#app.in{background:radial-gradient(120% 90% at 50% 40%,#2a2018 0%,#120d09 60%,#060403 100%)}
#deckbar{position:absolute;left:10px;right:60px;top:104px;display:none;gap:5px;overflow-x:auto;scrollbar-width:none;padding:6px;background:var(--panel);border:1px solid var(--line2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#deckbar::-webkit-scrollbar{display:none}#deckbar.show{display:flex}
#deckbar .chip{padding:8px 9px;min-width:34px;text-align:center;flex:none}
#where{position:absolute;left:10px;top:104px;display:none;background:var(--panel);border:1px solid var(--brass);color:var(--brass);padding:7px 10px;font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;max-width:calc(100% - 70px)}
#where.show{display:block}#where small{display:block;font:400 9.5px "IBM Plex Mono",monospace;color:var(--dim);letter-spacing:.04em;text-transform:none;margin-top:3px}
#dpad{position:absolute;left:14px;bottom:118px;display:none;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:4px;z-index:3}
#dpad.show{display:grid}#dpad button{border:1px solid var(--line2);background:var(--panel);color:var(--line);font-size:17px;border-radius:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.rb.hide{display:none}.rb.gold{border-color:var(--brass);color:var(--brass)}
.lbl.z i{display:none}.lbl.z span{display:block;border-left:0;background:rgba(6,16,30,.6);font-size:10px;padding:2px 5px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0 2px}
.tg{font:500 9.5px "IBM Plex Mono",monospace;padding:3px 6px;border:1px solid var(--line2);color:var(--dim);letter-spacing:.04em}
.tg.D{color:var(--ok);border-color:rgba(111,224,165,.4)}.tg.R{color:var(--brass);border-color:rgba(217,179,106,.45)}.tg.S{color:var(--warn);border-color:rgba(255,179,71,.45)}
.tg.c1{color:#d9b36a}.tg.c2{color:#6fa8dc}.tg.c3{color:#7fc98f}
.txt{font-size:13.5px;line-height:1.5;margin:8px 0 0}
.catl{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.catl button{display:flex;gap:7px;align-items:center;text-align:left;border:1px solid var(--line2);background:rgba(127,209,255,.05);color:var(--ink);padding:9px 8px;font:600 13px "Barlow Condensed",sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.catl button i{font:400 10px "IBM Plex Mono",monospace;font-style:normal;color:var(--line)}
.back{border:0;background:none;color:var(--line);font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:0 0 8px;cursor:pointer}
.tele{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tele figure{margin:0;text-align:center;border:1px solid var(--line2);padding:6px 4px;background:rgba(127,209,255,.04)}
.tele figcaption{font:600 10px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--line)}
.tele svg{width:100%;max-width:150px}
.ords{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
.ords button{border:1px solid var(--line2);background:rgba(127,209,255,.05);color:var(--ink);padding:7px 6px;text-align:left;font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.05em;cursor:pointer}
.ords button small{display:block;font:400 10px Barlow,sans-serif;color:var(--dim);letter-spacing:0}
.ords button.on{background:var(--brass);color:#1a1206;border-color:var(--brass)}.ords button.on small{color:#3a2a10}
.ords button.stop{grid-column:1/3;text-align:center}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.kv div{border:1px solid var(--line2);padding:5px 3px;text-align:center;font:500 13px "IBM Plex Mono",monospace}
.kv small{display:block;font:600 9px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--line);margin-top:2px}
#mlamp{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:#111a26;flex:none;transition:background .03s}
#mlamp.on{background:#bfe6ff;box-shadow:0 0 18px #7fd1ff}
.minp{width:100%;background:rgba(127,209,255,.06);border:1px solid var(--line2);color:var(--ink);font:500 15px "IBM Plex Mono",monospace;padding:9px;outline:none;text-transform:uppercase}
.mout{font:500 15px/1.6 "IBM Plex Mono",monospace;color:var(--brass);word-break:break-all;margin-top:8px;min-height:24px;letter-spacing:.08em}
.mout b{color:#fff;background:rgba(127,209,255,.3)}
table.cmp{width:100%;border-collapse:collapse;font-size:12px;line-height:1.35}
table.cmp th{font:600 10.5px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}
table.cmp td{padding:6px 4px;border-bottom:1px solid var(--line2);vertical-align:top}
table.cmp td:first-child{font:600 10px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--line);width:62px}
.ev{border-left:2px solid var(--line2);padding:5px 0 5px 9px;margin:0 0 4px;cursor:pointer}
.ev.on{border-left-color:var(--brass);background:rgba(217,179,106,.07)}
.ev b{font:500 10px "IBM Plex Mono",monospace;color:var(--brass);display:block}
.ev strong{font:600 13px "Barlow Condensed",sans-serif;letter-spacing:.05em;text-transform:uppercase}
.ev p{margin:3px 0 0;font-size:12.5px;line-height:1.4;display:none}.ev.on p{display:block}
.map{width:100%;border:1px solid var(--line2);background:#0a2a52;display:block;margin-bottom:8px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.cgrid button{border:1px solid var(--line2);background:rgba(127,209,255,.05);color:var(--ink);font:500 10px "IBM Plex Mono",monospace;padding:6px 2px;cursor:pointer}
.cgrid button.on{background:#2f8fe0;border-color:#2f8fe0;color:#fff}
.rooms button{display:flex;gap:7px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line2);background:none;color:var(--ink);padding:8px 0;font:500 13px Barlow,sans-serif;cursor:pointer}
.rooms i{width:9px;height:9px;border-radius:50%;flex:none}
@media (min-width:900px){#deckbar{left:66px;top:110px;right:auto}#where{left:66px;top:110px}#dpad{left:70px;bottom:130px}}
@media (max-height:480px){#deckbar,#where{top:64px}#dpad{bottom:96px}}
.skTop{position:sticky;top:-10px;z-index:3;background:#0a1626;margin:-10px -12px 8px;padding:10px 12px 8px;border-bottom:1px solid var(--line2)}
.skrow{display:flex;align-items:center;gap:8px}.skrow>div{flex:1}
#skc{font:700 30px/1 'Barlow Condensed',sans-serif;color:var(--brass)}
.skch{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:7px 0 2px}.skch .btn{padding:7px 2px;font-size:11px;text-align:center}
.skTop .kv{margin-top:2px}.skTop .kv div{padding:3px 2px;font-size:12px}
#skev{position:relative}
#sheet.tall{max-height:56%}
#fade{position:absolute;inset:0;background:#05080d;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}#fade.on{opacity:1}
.ev[data-sk] p{font-size:12.5px}
</style>
</head>
<body>
<div id="app">
 <canvas id="c" tabindex="0" aria-label="Modelo 3D do RMS Titanic"></canvas>
 <div id="labels"></div>
 <header id="top">
  <div class="brand"><span class="tag">CASCO Nº 401 · HARLAND &amp; WOLFF · BELFAST</span><h1>RMS Titanic <em>1912</em></h1><p>White Star Line · museu virtual e blueprint</p></div>
  <div id="hud"><div><b id="hO">–</b></div><div><b id="hR">–</b> rpm</div><div><b id="hK">–</b> nós</div></div>
 </header>
 <div id="cutbar"><button class="chip on" data-ax="z">Longit.</button><button class="chip" data-ax="x">Transv.</button><input id="cut" type="range" min="0" max="100" value="50" aria-label="Posição do corte"></div>
 <div id="deckbar"></div>
 <div id="where"></div>
 <div id="side">
  <button class="rb gold hide" id="bExit" title="Sair do ambiente">✕</button>
  <button class="rb gold hide" id="bWalk" title="Caminhar em primeira pessoa">👣</button>
  <button class="rb" id="bNight" title="Dia / noite">☾</button>
  <button class="rb" id="bBP" title="Alternar blueprint / realista">BP</button>
  <button class="rb" id="bHome" title="Reenquadrar">⟲</button>
  <button class="rb" id="bPlay" title="Pausar animação">❚❚</button>
 </div>
 <div id="dpad"><span></span><button data-k="w">▲</button><span></span><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
 <aside id="sheet"><div id="sheetHead"><h2 id="sheetT"></h2><button id="sheetX" aria-label="Fechar">×</button></div><div id="sheetBody"><div id="pDyn"></div></div></aside>
 <div id="hint">arraste: girar · pinça/roda: zoom · toque numa peça</div>
 <div id="bottom">
  <nav id="tools">
   <button class="chip" data-tab="explorar">Explorar</button>
   <button class="chip" data-tab="busca">Buscar</button>
   <button class="chip" data-tab="tele">Telégrafo</button>
   <button class="chip" data-tab="rota">Rota</button>
   <button class="chip" data-tab="sink">Naufrágio</button>
   <button class="chip" data-tab="sobre">Sobre</button>
  </nav>
  <nav id="modes">

/* ===== MÓDULO 4 — conteúdo: fichas, ambientes por convés, categorias, rota ===== */
// tag: D = informação histórica documentada · R = reconstrução visual plausível · S = simplificação da simulação
// [grupo, nome, inglês, tag, âncora, distância, texto]
const PD={
casco:['e','Casco','Hull','D',[40,14,14.2],170,'Aço doce rebitado — cerca de 3 milhões de rebites. 269,1 m de comprimento, 28,2 m de boca e 10,5 m de calado. Preto acima da linha d’água, vermelho anti-incrustante abaixo, com uma faixa amarela sob a superestrutura branca. A forma 3D aqui é gerada por fórmulas a partir das dimensões principais (reconstrução), não dos planos do estaleiro.'],
proa:['e','Proa e castelo de proa','Bow / forecastle','D',[126,22.5,0],60,'Roda de proa quase vertical. No castelo ficam os molinetes, cabrestantes, cabeços de amarração, o quebra-mar em V e a âncora central de cerca de 15,5 t, com seu guindaste próprio. Abaixo: alojamentos de tripulação e paiol da amarra.'],
popa:['e','Popa e tombadilho','Stern / poop deck','D',[-122,22.5,0],60,'Popa elíptica em balanço sobre o leme e os hélices. O tombadilho era o espaço ao ar livre da 3ª classe; sobre ele ficava a ponte de atracação, usada nas manobras de porto. Abaixo do convés: sala geral e sala de fumar da 3ª classe.'],
quilha:['e','Quilha e cadaste','Keel / stern frame','D',[40,-.4,0],120,'A quilha foi batida em 31 de março de 1909 no estaleiro Harland & Wolff, em Belfast (casco nº 401). Sobre ela, um fundo duplo celular com cerca de 1,6 m de altura percorria quase todo o comprimento.'],
cavername:['e','Cavername','Frames','S',[100,8,-9],80,'Costelas de aço que dão forma ao casco e sustentam as chapas. No modelo há uma caverna a cada 6 m para facilitar a leitura; no navio real o espaçamento era de cerca de 90 cm a meio-navio e menor nas extremidades.'],
anteparas:['i','Anteparas estanques','Watertight bulkheads','D',[66,9,0],90,'Quinze anteparas transversais (A a P) dividiam o casco em 16 compartimentos. Subiam até o convés E a meio-navio e até o D nas extremidades — não até o topo do casco. As posições no modelo são aproximadas.'],
portas:['i','Portas estanques','Watertight doors','D',[47,2.9,0],50,'No nível do fundo, 12 portas verticais de ferro fundido desciam por gravidade. Podiam ser soltas por um interruptor elétrico na ponte, por alavanca no local ou automaticamente por um flutuador, se a água entrasse. Escadas de escape permitiam a saída de quem ficasse do outro lado.'],
conves:['e','Conveses','Decks','D',[60,19,6],100,'Dez níveis: Botes, A (passeio), B (ponte), C (abrigo), D (salão), E (superior), F (intermediário), G (inferior), Orlop e teto do fundo duplo. Use o modo “Conveses” para ver cada planta.'],
fundo:['i','Fundo duplo','Double bottom / tank top','D',[90,1.7,0],70,'Estrutura celular entre o fundo externo e o “teto do fundo duplo”, usada para lastro e água de alimentação das caldeiras. Protegia contra encalhes, mas não se estendia pelos costados — proteção acrescentada ao Olympic e ao Britannic depois de 1912.'],
superestrutura:['e','Superestrutura','Superstructure','D',[-30,25.5,14],120,'Conveses A e dos Botes. Traço que distingue o Titanic do Olympic de 1911: a metade de vante do passeio do convés A é fechada por janelas, e o convés B não tem passeio aberto — o espaço foi ocupado por camarotes, suítes com passeio privativo e o Café Parisien.'],
chamine:['e','Chaminés 1 a 3','Funnels 1–3','D',[11,46,0],110,'Elípticas, inclinadas para ré, na cor “buff” da White Star com topo preto. Cada uma recebe os condutos de fumaça de duas salas de caldeiras: nº 1 (salas 6 e 5), nº 2 (salas 4 e 3), nº 3 (salas 2 e 1).'],
chamine4:['e','Quarta chaminé','Fourth funnel','D',[-57,46,0],110,'Não servia às caldeiras. Ventilava a sala da turbina e das máquinas e recebia a exaustão das cozinhas e da lareira do salão de fumar. Também equilibrava visualmente o perfil do navio. Por isso não solta fumaça no modelo.'],
mastro:['e','Mastros','Masts','D',[-98,50,0],120,'Dois mastros de aço, inclinados como as chaminés. Sustentavam a antena Marconi, as luzes de navegação, os paus de carga e as bandeiras: a flâmula da White Star no mastro principal e o pavilhão azul (Blue Ensign) na popa.'],
gavea:['e','Gávea (cesto do vigia)','Crow’s nest','D',[87,39.6,0],46,'Plataforma no mastro de proa, cerca de 15 m acima do castelo. Dois vigias em turnos de duas horas. O acesso era por uma escada dentro do mastro oco. Tinha um sino e um telefone direto para a ponte. Abra “Gávea” no menu Explorar para ver daqui.'],
antena:['e','Antena Marconi','Marconi aerial','D',[0,58,0],140,'Quatro fios paralelos estendidos entre os dois mastros (antena em T), com descida até a sala de rádio no convés dos botes.'],
bote:['e','Botes salva-vidas','Lifeboats and davits','D',[48,28.6,12.6],60,'Vinte botes: 14 de madeira para 65 pessoas, 2 cúteres de emergência para 40 (mantidos prontos, fora da borda) e 4 desmontáveis Engelhardt para 47. Total: 1.178 lugares, para cerca de 2.200 pessoas a bordo — acima do exigido pela regra da época, baseada na tonelagem. Turcos Welin de duplo efeito, capazes de servir mais botes do que os instalados.'],
ancora:['e','Âncoras','Anchors','D',[124.5,17,3.2],46,'Duas âncoras de leva nos escovéns (cerca de 8 t cada) e uma âncora central de 15,5 t sobre o castelo, movimentada por um guindaste próprio.'],
corrente:['e','Amarras','Anchor chains','D',[118,23,2],46,'Correntes de elos com travessão, movidas pelos molinetes a vapor do castelo e guardadas no paiol da amarra.'],
conves_eq:['e','Guindastes e amarração','Cranes and mooring gear','R',[-83,24,8],70,'Guindastes elétricos nos poços de proa e de ré, cabrestantes e cabeços de amarração. Quantidade e posição no modelo são aproximadas.'],
leme:['e','Leme','Rudder','D',[-128,5,0],50,'Um único leme central de aço fundido, com cerca de 24 m de altura e mais de 100 t, movido por máquinas a vapor na popa comandadas pelo telemotor da ponte.'],
helice:['e','Hélices','Propellers','D',[-119,3.5,6.4],50,'Três hélices de bronze. Os laterais (7,2 m, três pás) eram movidos pelas máquinas alternativas; o central (cerca de 5,2 m), pela turbina. Nota: o número de pás do hélice central do Titanic é debatido — um caderno do estaleiro indica três pás, e não quatro como no Olympic de 1911. O modelo segue três.'],
ponte:['e','Ponte de comando','Navigating bridge','D',[66.5,28.6,0],60,'Posto de comando no extremo de vante do convés dos botes, com asas até a borda. Use “Visitar” para entrar.'],
camarotes:['i','Divisórias de camarotes','Cabin partitions','S',[20,17,9],70,'Divisórias genéricas, apenas para dar leitura aos cortes. A arrumação real de cada convés está nas plantas do modo “Conveses”.'],
caldeira:['m','Caldeiras','Scotch boilers','D',[3.3,7.4,0],80,'29 caldeiras escocesas de 4,8 m de diâmetro: 24 de dupla face (6,1 m, seis fornalhas) e 5 de face simples (três fornalhas), a 215 psi. Seis salas: a nº 6, a vante, com quatro; as nº 5 a 2 com cinco lado a lado; a nº 1 com as cinco de face simples. Total: 159 fornalhas.'],
fornalha:['m','Fornalhas','Furnaces','D',[6.4,3.3,0],34,'159 fornalhas corrugadas. Os foguistas lançavam o carvão em camada fina, quebravam a escória e retiravam as cinzas, que iam para ejetores e eram lançadas ao mar. O consumo passava de 600 toneladas por dia.'],
carvao:['m','Carvoeiras','Coal bunkers','D',[12,8.6,0],70,'Depósitos transversais junto a cada antepara das salas de caldeiras, com portas diante das fornalhas. Capacidade: cerca de 6.600 t. Carvoeiros (trimmers) levavam o carvão em carrinhos até a praça de fornalhas.'],
dutos:['m','Condutos de fumaça','Uptakes','D',[30,16,0],80,'Levam os gases das caldeiras até as três primeiras chaminés, atravessando os conveses de passageiros dentro de invólucros.'],
salaCald:['m','Salas de caldeiras','Boiler rooms','D',[20.8,2.4,6],70,'Seis salas numeradas de ré para vante (1 a 6). Cerca de 175 foguistas e 70 carvoeiros trabalhavam em turnos de 4 horas. A ventilação era forçada por ventiladores elétricos.'],
maquina:['m','Máquinas alternativas','Triple-expansion engines','D',[-43.5,12.6,6.4],60,'Duas máquinas de quatro cilindros e tripla expansão: um de alta pressão (54 pol.), um de média (84 pol.) e dois de baixa (97 pol.), curso de 75 pol. Cerca de 15.000 cv cada, a 75 rpm, movendo os hélices laterais. Tinham quase 10 m de altura. Podiam inverter a rotação para dar ré.'],
bielas:['m','Bielas e manivelas','Connecting rods and cranks','S',[-41.5,6,6.4],34,'Haste, cruzeta e biela transformam o vaivém do êmbolo em rotação. No modelo as manivelas estão a 90°; o navio real usava o balanceamento Yarrow-Schlick-Tweedy, com ângulos diferentes. O mecanismo das válvulas não é mostrado.'],
turbina:['m','Turbina de baixa pressão','Parsons low-pressure turbine','D',[-62.5,7,0],50,'Turbina Parsons de exaustão: aproveitava o vapor que saía das máquinas alternativas, já a cerca de 9 psi absolutos, e o expandia até quase o vácuo. Cerca de 16.000 cv a 165 rpm no hélice central. Não invertia: nas manobras e em marcha a ré o vapor era desviado direto aos condensadores e o hélice central ficava parado.'],

function surfY(list,O,x,z,y){let best=null;for(let i=0;i<list.length;i++){const s=list[i];if(x<s[0]+O.x||x>s[1]+O.x||z<s[2]+O.z||z>s[3]+O.z)continue;const sy=O.y+(typeof s[4]==='function'?s[4]({x:x-O.x,z:z-O.z}):s[4]);if(Math.abs(sy-y)<=.75&&(best===null||Math.abs(sy-y)<Math.abs(best-y)))best=sy;}return best;}

 smoke.forEach(sp=>{const u=sp.userData;if(run)u.life+=dt/6;if(u.life>=1){u.life=0;const f=funnelTops[u.f];sp.position.set(f.x+Math.random(),f.y+.5+Math.random(),(Math.random()-.5)*2);u.v.set(-(2+Math.abs(sim.kn)*.5)-Math.random(),3.6+Math.random(),(Math.random()-.5));u.on=Math.random()<.15+sim.burn;}
  if(run)sp.position.addScaledVector(u.v,dt);const k=u.life;sp.scale.setScalar(4+20*k);sp.material.opacity=u.on?.42*Math.sin(PI*k)*Math.min(1,.2+sim.burn):0;sp.visible=smOn;});
 if(Math.abs(S.exT-S.ex)>.001){S.ex+=(S.exT-S.ex)*Math.min(1,dt*3.2);if(Math.abs(S.exT-S.ex)<.002)S.ex=S.exT;items.forEach(it=>{it.o.position.copy(it.base).addScaledVector(it.ex,S.ex);});grid.position.y=-2-36*S.ex;}
 if(S.fp)fpMove(dt);floodStep(dt);if(S.tab==='sink'&&sk.play){const t=sk.t;sk.t=Math.min(176,t+dt*(t<0?.22:t<145?4:t<155?2:t<161.5?.3:t<171?1:.8));if(sk.t>=176)sk.play=false;sinkApply();}
 const es=SETS.escadaria.g;if(es&&es.visible&&es.userData.cars)es.userData.cars.forEach(c=>{const u=((time*.16+c.ph)%2),v=u<1?u:2-u,q=Math.max(0,Math.min(1,(v-.25)/.5));c.o.position.y=3.2*q*q*(3-2*q);});
 hudT+=dt;if(hudT>.15){hudT=0;$('#hO').textContent=ORDERS[tel.ack].replace(' Ahead',' ▲').replace(' Astern',' ▼');$('#hR').textContent=Math.round(sim.rpm);$('#hK').textContent=nf(Math.abs(sim.kn),1);
  if(S.tab==='tele'){const e=(id,v)=>{const x=document.getElementById(id);if(x)x.textContent=v;};e('kA',Math.round(sim.rpm));e('kT',Math.round(sim.trpm));e('kK',nf(Math.abs(sim.kn),1));e('kC',Math.round(40+600*Math.pow(Math.abs(sim.rpm)/75,3)));}}}

function resize(){const w=window.innerWidth,h=window.innerHeight;R.setSize(w,h,false);cam.aspect=w/h;const bh=$('#bottom').offsetHeight;sheet.style.bottom=(w>=900?bh+12:bh)+'px';
