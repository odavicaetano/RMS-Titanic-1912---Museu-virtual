<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1120;--ink:#e6eef8;--dim:#93a7bf;--line:#7fd1ff;--line2:rgba(127,209,255,.22);--panel:rgba(9,19,34,.82);--warn:#ffb347;--bad:#ff6b5e;--ok:#6fe0a5;--brass:#d9b36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:14px}
#app{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 35%,#1a2c44 0%,#0c1626 55%,#060b14 100%);transition:background .5s}
#app.bp{background:
 repeating-linear-gradient(0deg,rgba(140,200,255,.07) 0 1px,transparent 1px 32px),
 repeating-linear-gradient(90deg,rgba(140,200,255,.07) 0 1px,transparent 1px 32px),
 radial-gradient(120% 90% at 50% 35%,#0f3a72 0%,#0a2a56 55%,#061a38 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;display:flex;align-items:center;gap:5px;border:0;background:none;padding:4px;color:var(--ink);font:500 11px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.lbl i{font:500 10px/18px "IBM Plex Mono",monospace;font-style:normal;width:19px;height:19px;border-radius:50%;border:1px solid var(--line);background:rgba(6,16,30,.78);color:var(--line);text-align:center;flex:none}
.lbl span{display:none;background:rgba(6,16,30,.7);padding:3px 6px;border-left:1px solid var(--line)}
.lbl.on i{background:var(--line);color:#04101e}
.lbl.on span{display:block}
.dim{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:500 10px/1 "IBM Plex Mono",monospace;color:#cfeaff;background:rgba(8,38,80,.8);padding:3px 6px;border:1px solid var(--line2);white-space:nowrap}
#top{background:linear-gradient(rgba(5,10,19,.8),rgba(5,10,19,0));padding-bottom:26px!important;position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 12px;pointer-events:none}
.brand .tag{font:500 9px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;color:var(--line)}
.brand h1{margin:3px 0 1px;font:700 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.03em;text-transform:uppercase}
.brand h1 em{font-style:normal;font-weight:500;color:var(--brass)}
.brand p{margin:0;font-size:11px;color:var(--dim)}
#hud{display:flex;flex-direction:column;gap:3px;align-items:flex-end;font:500 11px/1 "IBM Plex Mono",monospace;pointer-events:auto}
#hud div{background:var(--panel);border:1px solid var(--line2);padding:4px 7px;min-width:78px;text-align:right}
#hud b{color:var(--line);font-weight:500}
#side{position:absolute;right:10px;top:104px;display:flex;flex-direction:column;gap:7px}
.rb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font:600 12px "Barlow Condensed",sans-serif;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rb.on{background:var(--line);color:#04101e;border-color:var(--line)}
#cutbar{position:absolute;left:10px;right:60px;top:104px;display:none;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line2);padding:6px 9px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:460px}
#cutbar.show{display:flex}
#cutbar button{flex:none}
.chip,.btn{border:1px solid var(--line2);background:rgba(127,209,255,.06);color:var(--ink);font:600 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;cursor:pointer;white-space:nowrap}
.chip.on,.btn.on{background:var(--line);color:#04101e;border-color:var(--line)}
.btn.hot{border-color:var(--warn);color:var(--warn)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line2)}
input[type=range]::-moz-range-track{height:3px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--line);margin-top:-8px;border:2px solid #04101e}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--line);border:2px solid #04101e}
#bottom{position:absolute;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0)}
#tools{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools .chip{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#tools .chip.on{background:var(--line)}
#modes{display:flex;background:rgba(5,12,22,.94);border-top:1px solid var(--line2)}
#modes button{flex:1;border:0;border-right:1px solid rgba(127,209,255,.1);background:none;color:var(--dim);font:600 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.07em;text-transform:uppercase;padding:9px 2px 10px;cursor:pointer}
#modes button small{display:block;font:400 9px/1 "IBM Plex Mono",monospace;margin-bottom:5px;color:rgba(127,209,255,.55);letter-spacing:.1em}
#modes button.on{color:#04101e;background:var(--line)}
#modes button.on small{color:#0b3a66}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:46%;display:none;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:up .25s ease}
#sheet.show{display:flex}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
#sheetHead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line2);flex:none}
#sheetHead h2{margin:0;font:600 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--line)}
#sheetHead button{border:0;background:none;color:var(--ink);font-size:20px;line-height:1;padding:2px 6px;cursor:pointer}
#sheetBody{overflow-y:auto;padding:10px 12px 14px;-webkit-overflow-scrolling:touch}
.ficha h3{margin:0;font:700 22px/1.05 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em}
.ficha .hd{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.ficha .num{font:500 12px/26px "IBM Plex Mono",monospace;width:28px;height:28px;text-align:center;border:1px solid var(--line);border-radius:50%;color:var(--line);flex:none}
.ficha .en{font:400 11px "IBM Plex Mono",monospace;color:var(--brass)}
dl{margin:8px 0 0;display:grid;grid-template-columns:92px 1fr;gap:0}
dt{font:600 10px/1.5 "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--line);padding:6px 6px 6px 0;border-top:1px solid var(--line2)}
dd{margin:0;padding:6px 0;border-top:1px solid var(--line2);line-height:1.4;font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.note{font-size:11.5px;color:var(--dim);line-height:1.4;margin:8px 0 0}
.note b{color:var(--warn);font-weight:500}
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g{position:relative;text-align:center;border:1px solid var(--line2);padding:4px 2px 5px;background:rgba(127,209,255,.04)}
.g svg{width:100%;max-width:74px;display:block;margin:0 auto}
.g .v{position:absolute;left:0;right:0;top:27%;font:500 13px "IBM Plex Mono",monospace}
.g .u{font:400 9px "IBM Plex Mono",monospace;color:var(--dim)}
.g .t{font:600 9.5px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--line);margin-top:1px}
.g.warn .v{color:var(--warn)}.g.bad .v{color:var(--bad)}
.ctl{margin-top:10px}
.ctl label{display:flex;justify-content:space-between;font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--line)}
.ctl label b{color:var(--ink);font:500 11px "IBM Plex Mono",monospace}
#status{margin-top:8px;font:400 11px/1.4 "IBM Plex Mono",monospace;color:var(--ok);min-height:16px}
#status.warn{color:var(--warn)}#status.bad{color:var(--bad)}
.list{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.list button{display:flex;align-items:center;gap:6px;text-align:left;border:1px solid var(--line2);background:rgba(127,209,255,.04);color:var(--ink);padding:6px;font:500 12.5px "Barlow",sans-serif;cursor:pointer;min-width:0}
.list button i{font:400 10px "IBM Plex Mono",monospace;font-style:normal;color:var(--line);flex:none}
.list button.off{opacity:.45}
h4{margin:12px 0 6px;font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
h4:first-child{margin-top:0}
.step{display:flex;gap:10px;align-items:flex-start}
.step .n{font:700 34px/1 "Barlow Condensed",sans-serif;color:var(--line);min-width:38px}
.step h3{margin:0 0 4px;font:700 18px/1.1 "Barlow Condensed",sans-serif;text-transform:uppercase}
.step p{margin:0;line-height:1.45;font-size:13px}
.dots{display:flex;gap:4px;margin-top:10px}
.dots b{flex:1;height:3px;background:var(--line2)}.dots b.on{background:var(--line)}
.sys{border:1px solid var(--line2);margin-bottom:6px;background:rgba(127,209,255,.04)}
.sys summary{padding:8px;font:600 13px "Barlow Condensed",sans-serif;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
.sys div{padding:0 8px 8px;font-size:13px;line-height:1.45}
.tog{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line2);font-size:13px}
.tog:first-of-type{border-top:0}
a{color:var(--line)}
#hint{position:absolute;left:50%;top:auto;bottom:150px;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;align-items:flex-start;font:400 11px "IBM Plex Mono",monospace;color:var(--dim);background:var(--panel);padding:7px 10px;border:1px solid var(--line2);pointer-events:none;transition:opacity .8s;text-align:center;white-space:nowrap}
#load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#081425;font:500 12px "IBM Plex Mono",monospace;color:var(--line);letter-spacing:.1em;text-align:center;padding:20px;z-index:9}
@media (min-width:900px){
 #sheet{left:auto;right:14px;top:86px;bottom:112px;width:390px;max-height:none;border:1px solid var(--line2)}
 #side{right:auto;left:14px;top:110px}
 #cutbar{left:66px;top:110px}
 .brand h1{font-size:30px}
 #top{padding:14px 18px}
 #hud{flex-direction:row}
 #tools{justify-content:center}
 #modes{max-width:720px;margin:0 auto;border:1px solid var(--line2);border-bottom:0}
 .lbl span{display:block}
}
@media (max-height:480px){#sheet{max-height:62%;left:auto;width:54%}.brand p{display:none}#side{top:64px}#cutbar{top:64px}}

#app.night{background:radial-gradient(120% 90% at 50% 35%,#0b1524 0%,#050a12 60%,#020409 100%)}
#app.deep{background:radial-gradient(120% 90% at 50% 20%,#0a2233 0%,#04101a 55%,#010508 100%)}
#app.in{background:radial-gradient(120% 90% at 50% 40%,#2a2018 0%,#120d09 60%,#060403 100%)}
#deckbar{position:absolute;left:10px;right:60px;top:104px;display:none;gap:5px;overflow-x:auto;scrollbar-width:none;padding:6px;background:var(--panel);border:1px solid var(--line2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#deckbar::-webkit-scrollbar{display:none}#deckbar.show{display:flex}
#deckbar .chip{padding:8px 9px;min-width:34px;text-align:center;flex:none}
#where{position:absolute;left:10px;top:104px;display:none;background:var(--panel);border:1px solid var(--brass);color:var(--brass);padding:7px 10px;font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;max-width:min(300px,calc(100% - 70px))}
#where.show{display:block}#where small{display:block;line-height:1.5;white-space:normal;font:400 9.5px "IBM Plex Mono",monospace;color:var(--dim);letter-spacing:.04em;text-transform:none;margin-top:3px}
#dpad{position:absolute;left:18px;bottom:124px;display:none;z-index:3}#dpad.show{display:block}
#joyB{position:relative;width:104px;height:104px;border-radius:50%;border:1px solid var(--line2);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#joyB i{position:absolute;color:var(--line);opacity:.8;line-height:0}#joyB i:nth-child(1){left:43px;top:5px}#joyB i:nth-child(2){right:5px;top:43px}#joyB i:nth-child(3){left:43px;bottom:5px}#joyB i:nth-child(4){left:5px;top:43px}
#joyK{position:absolute;left:33px;top:33px;width:36px;height:36px;border-radius:50%;background:var(--line);opacity:.85;border:2px solid #04101e;pointer-events:none;transition:transform .06s}
.rb.hide{display:none}.rb.mut{position:relative;opacity:.75}.rb.mut:after{content:'';position:absolute;left:8px;right:8px;top:50%;height:2px;background:var(--ink);transform:rotate(-45deg)}.rb.gold{border-color:var(--brass);color:var(--brass)}
.lbl.z i{display:none}.lbl.z span{display:block;border-left:0;background:rgba(6,16,30,.6);font-size:10px;padding:2px 5px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0 2px}
.tg{font:500 9.5px "IBM Plex Mono",monospace;padding:3px 6px;border:1px solid var(--line2);color:var(--dim);letter-spacing:.04em}
.tg.D{color:var(--ok);border-color:rgba(111,224,165,.4)}.tg.R{color:var(--brass);border-color:rgba(217,179,106,.45)}.tg.S{color:var(--warn);border-color:rgba(255,179,71,.45)}
.tg.c1{color:#d9b36a}.tg.c2{color:#6fa8dc}.tg.c3{color:#7fc98f}
.txt{font-size:13.5px;line-height:1.5;margin:8px 0 0}
.catl{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.catl button{display:flex;gap:7px;align-items:center;text-align:left;border:1px solid var(--line2);background:rgba(127,209,255,.05);color:var(--ink);padding:9px 8px;font:600 13px "Barlow Condensed",sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.catl button i{font:400 10px "IBM Plex Mono",monospace;font-style:normal;color:var(--line)}
.back{display:block;border:0;background:none;color:var(--line);font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:0 0 8px;cursor:pointer}
.tele{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tele figure{margin:0;text-align:center;border:1px solid var(--line2);padding:6px 4px;background:rgba(127,209,255,.04)}
.tele figcaption{font:600 10px "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--line)}
.tele svg{width:100%;max-width:150px}
.ords{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
.ords button{border:1px solid var(--line2);background:rgba(127,209,255,.05);color:var(--ink);padding:7px 6px;text-align:left;font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.05em;cursor:pointer}
.ords button small{display:block;font:400 10px Barlow,sans-serif;color:var(--dim);letter-spacing:0}
.ords button.on{background:var(--brass);color:#1a1206;border-color:var(--brass)}.ords button.on small{color:#3a2a10}
.ords button.stop{grid-column:1/3;text-align:center}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.kv div{border:1px solid var(--line2);padding:5px 3px;text-align:center;font:500 13px "IBM Plex Mono",monospace}
.kv small{display:block;font:600 9px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--line);margin-top:2px}
#mlamp{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:#111a26;flex:none;transition:background .03s}
#mlamp.on{background:#bfe6ff;box-shadow:0 0 18px #7fd1ff}
.minp{width:100%;background:rgba(127,209,255,.06);border:1px solid var(--line2);color:var(--ink);font:500 15px "IBM Plex Mono",monospace;padding:9px;outline:none;text-transform:uppercase}
.mout{font:500 15px/1.6 "IBM Plex Mono",monospace;color:var(--brass);word-break:break-all;margin-top:8px;min-height:24px;letter-spacing:.08em}
